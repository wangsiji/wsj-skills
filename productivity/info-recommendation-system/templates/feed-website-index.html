<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信息流 | 时间线</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --card: #222;
    --border: #333;
    --text: #e0e0e0;
    --text-muted: #888;
    --accent: #58a6ff;
    --tag-twitter: #1da1f2;
    --tag-longform: #2ea043;
    --tag-podcast: #a371f7;
    --tag-video: #d29922;
    --tag-default: #8b949e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }

  .header {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; backdrop-filter: blur(8px);
  }
  .header h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; }
  .header h1 span { color: var(--text-muted); font-weight: 400; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    padding: 4px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); cursor: pointer;
    font-size: 0.85rem; transition: all .2s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .container { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }

  .item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 20px; margin-bottom: 12px;
    transition: border-color .2s;
  }
  .item:hover { border-color: #444; }

  .item-meta {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;
  }
  .item-meta .tag {
    display: inline-block; padding: 1px 8px; border-radius: 10px;
    font-size: 0.75rem; font-weight: 500; color: #fff;
  }
  .tag-twitter { background: var(--tag-twitter); }
  .tag-longform { background: var(--tag-longform); }
  .tag-podcast { background: var(--tag-podcast); }
  .tag-video { background: var(--tag-video); }

  .item-title {
    font-size: 1rem; font-weight: 500; line-height: 1.5; margin-bottom: 6px;
  }
  .item-title a {
    color: var(--accent); text-decoration: none;
  }
  .item-title a:hover { text-decoration: underline; }

  .item-content {
    font-size: 0.875rem; color: var(--text-muted); line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .item-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 8px; font-size: 0.8rem; color: var(--text-muted);
  }
  .item-author { font-weight: 500; }
  .item-time { color: #666; }

  .empty { text-align: center; padding: 48px 0; color: var(--text-muted); }
  .empty-sub { font-size: 0.875rem; margin-top: 8px; color: #555; }
</style>
</head>
<body>

<div class="header">
  <h1>信息流 <span>| 时间线</span></h1>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="twitter">Twitter</button>
    <button class="filter-btn" data-filter="longform">长文</button>
    <button class="filter-btn" data-filter="podcast">播客</button>
  </div>
</div>

<div class="container" id="timeline">
  <!-- ITEMS_PLACEHOLDER -->
</div>

<script>
  const items = document.querySelectorAll('.item');
  const filters = document.querySelectorAll('.filter-btn');
  const typeMap = { 'twitter': 'twitter', 'longform': 'longform', 'podcast': 'podcast' };

  filters.forEach(btn => {
    btn.addEventListener('click', () => {
      filters.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter;
      items.forEach(item => {
        if (filter === 'all') { item.style.display = ''; return; }
        const type = item.dataset.type;
        item.style.display = type === filter ? '' : 'none';
      });
    });
  });
</script>

</body>
</html>
